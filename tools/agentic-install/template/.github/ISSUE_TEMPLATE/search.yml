name: "Search: find content in the KB"
description: Search the knowledge base for a term or concept and get ranked results
labels: ["kb-search"]
body:
  - type: markdown
    attributes:
      value: |
        Enter your search query below. A constrained job will run LexCAT BM25 retrieval over the wiki and post ranked text results. This is model-free lexical retrieval, and it does not call a generative model.
  - type: textarea
    id: query
    attributes:
      label: Search query
      description: A question, phrase, or concept to retrieve from the wiki.
      placeholder: "e.g. tiered index progressive disclosure"
    validations:
      required: true
